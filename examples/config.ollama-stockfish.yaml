# Copy this file and replace the Stockfish path before running it.
# Pull the model first with: ollama pull llama3.2:3b
schema_version: 1
run:
  output_dir: ../runs
  seed: 0
dataset:
  path: positions.jsonl
task:
  kind: chess_first_move
  prompt_version: chess-uci-v1
model:
  kind: openai_chat
  base_url: http://localhost:11434/v1
  model: llama3.2:3b
  # Conservative local defaults avoid loading several generations concurrently.
  batch_size: 4
  max_concurrency: 1
  timeout_seconds: 180
  max_attempts: 1
  parameters:
    temperature: 0
    max_tokens: 32
metrics:
  reference: true
  engine:
    enabled: true
    path: /ABSOLUTE/PATH/TO/stockfish
    nodes: 100000
    threads: 1
    hash_mb: 128
    timeout_seconds: 60
artifacts:
  store_prompts: true
  store_raw_responses: true
