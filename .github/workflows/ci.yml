name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: true
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} ruff format --check .
      - run: uv run --python ${{ matrix.python }} ruff check .
      - run: uv run --python ${{ matrix.python }} mypy src
      - run: uv run --python ${{ matrix.python }} pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv build
      - run: uv run twine check dist/*
      - run: uv run pip-audit
      - run: uv run pip-licenses --fail-on="GNU Affero General Public License v3"
      - run: uv run --no-project --with dist/*.whl firstmove-eval --help

